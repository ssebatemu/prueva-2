name: Actualizar Lista M3U Disney

on:
  schedule:
    - cron: '0 * * * *' # Se ejecuta automáticamente al inicio de cada hora
  workflow_dispatch: # Te permite ejecutar el proceso manualmente desde GitHub cuando quieras

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Ejecutar script de raspado y actualización
      run: |
        cat << 'EOF' > scraper.py
        import requests
        from bs4 import BeautifulSoup
        import os

        TARGET_URL = "https://la18hd.su/eventos/"
        FILE_PATH = "dep" # El archivo 'dep' se ubica en la raíz del repositorio

        try:
            # 1. Obtener el contenido de la página web
            headers = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)"}
            response = requests.get(TARGET_URL, headers=headers, timeout=30)
            response.raise_for_status()
            
            # 2. Parsear el HTML y buscar enlaces con la palabra 'disney'
            soup = BeautifulSoup(response.text, 'html.parser')
            disney_links = []
            
            for a_tag in soup.find_all('a', href=True):
                href = a_tag['href']
                # Filtrar enlaces que contengan 'disney' ignorando mayúsculas/minúsculas
                if 'disney' in href.lower():
                    # Resolver URLs relativas en absolutas
                    if href.startswith('/'):
                        href = f"https://la18hd.su{href}"
                    elif not href.startswith('http'):
                        href = f"https://la18hd.su/eventos/{href}"
                    
                    if href not in disney_links:
                        disney_links.append(href)

            # 3. Generar el contenido en formato M3U para IPTV
            if disney_links:
                m3u_lines = ["#EXTM3U\n"]
                for i, link in enumerate(disney_links, start=1):
                    m3u_lines.append(f"#EXTINF:-1,Disney Channel {i}\n{link}\n")
                m3u_content = "".join(m3u_lines)
                
                # 4. Escribir el resultado en el archivo 'dep'
                with open(FILE_PATH, "w", encoding="utf-8") as f:
                    f.write(m3u_content)
                print(f"Se encontraron {len(disney_links)} enlaces de Disney. Archivo 'dep' actualizado.")
            else:
                print("No se encontraron enlaces con la palabra 'disney'.")
                with open(FILE_PATH, "w", encoding="utf-8") as f:
                    f.write("#EXTM3U\n")

        except Exception as e:
            print(f"Ocurrió un error durante la ejecución: {e}")
            exit(1)
        EOF
        python scraper.py

    - name: Confirmar y subir cambios a GitHub
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add dep
        if git diff --staged --quiet; then
          echo "No hay cambios detectados en el archivo 'dep'."
        else
          git commit -m "Automatización: Actualización por hora de enlaces Disney en M3U"
          git push
        fi
