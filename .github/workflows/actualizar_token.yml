name: Insertar Token antes de /live

on:
  push:
    paths:
      - 'token.txt' # Se activa únicamente cuando cambias el token

permissions:
  contents: write # Otorga permisos para guardar los cambios de vuelta en tu GitHub

jobs:
  update-m3u:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v4 #

    - name: Resetear base.m3u e inyectar Token
      run: |
        # 1. Traer la versión limpia/original de base.m3u para evitar acumular tokens viejos
        git checkout HEAD -- base.m3u
        
        # 2. Leer el contenido de token.txt limpiando saltos de línea basura
        TOKEN=$(cat token.txt | tr -d '\n' | tr -d '\r')
        
        # Validar que el token no esté vacío antes de proceder
        if [ -z "$TOKEN" ]; then
          echo "El archivo token.txt está vacío. No se realizarán cambios."
          exit 0
        fi
        
        echo "Insertando el prefijo: $TOKEN antes de /live"
        
        # 3. Modificar base.m3u usando sed
        # Busca todas las coincidencias de '/live' y les antepone el contenido extraído de token.txt
        sed -i "s|/live|$TOKEN/live|g" base.m3u

    - name: Guardar cambios en GitHub
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add base.m3u
        
        # Comprobar si realmente hubo cambios antes de confirmar
        git diff --quiet --staged || (git commit -m "Automatización: Token agregado antes de /live" && git push)
