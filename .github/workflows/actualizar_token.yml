name: Actualizar Lista IPTV cada 6 horas

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Extraer Token de la Web Protegida
      run: |
        # Descargar el HTML usando el Secreto oculto de GitHub
        curl -s "${{ secrets.URL_FUENTE }}" > pagina.html
        
        # Extraer la URL del token buscando la cadena que empieza con 'https://edge-'
        URL_TOKEN=$(grep -oE "https://edge-[^<\"]+" pagina.html | head -n 1)
        
        # Limpiar espacios en blanco o retornos de carro molestos
        URL_TOKEN=$(echo "$URL_TOKEN" | tr -d '\n' | tr -d '\r' | xargs)
        
        # Validar si se encontró un token válido
        if [[ -z "$URL_TOKEN" || ! "$URL_TOKEN" =~ ^https://edge- ]]; then
          echo "Error: No se pudo extraer un token válido."
          exit 1
        fi
        
        # Registramos la variable de forma segura en el entorno
        echo "NEW_TOKEN=$URL_TOKEN" >> $GITHUB_ENV

    - name: Generar archivo Lista M3U
      run: |
        # Reemplazar 'TOKEN' por la URL extraída y volcarlo en 'Lista'
        sed "s|TOKEN|$NEW_TOKEN|g" base.m3u > Lista
        echo "Archivo 'Lista' generado exitosamente."

    - name: Subir cambios a GitHub
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        
        git add Lista
        git diff --quiet --staged || (git commit -m "Automatización: Lista IPTV actualizada con nuevo token" && git push)
