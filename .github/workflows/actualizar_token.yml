    - name: Guardar cambios en el repositorio
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add token.txt
        # Forzar el commit y subida incluso si hay conflictos de sincronización
        git commit -m "Automatización: Token actualizado" || echo "No hay cambios para subir"
        git push origin HEAD:${{ github.ref }}
